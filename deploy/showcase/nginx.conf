# Include in the HTTPS server for the public viewer host.
location = /YunAlpha {
    auth_request off;
    return 308 /YunAlpha/;
}

location = /YunAlpha/api/v1/strategies {
    auth_request off;
    default_type application/json;
    alias /data/www/YunAlpha/current/site/api/v1/strategy-catalog.json;
    limit_except GET { deny all; }
}

location ^~ /YunAlpha/api/v1/research/content/ {
    auth_request off;
    alias /data/www/YunAlpha/current/site/api/v1/research/content/;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; base-uri 'none'; form-action 'none'" always;
    limit_except GET { deny all; }
}

location = /YunAlpha/api/v1/strategies/dividend-lowvol {
    auth_request off;
    default_type text/html;
    alias /data/www/YunAlpha/current/site/api/v1/strategies/dividend-lowvol;
    limit_except GET { deny all; }
}

location ^~ /YunAlpha/workspaces/fof/ {
    auth_request off;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:19313/;
}

location = /YunAlpha/workspaces/fof/api/backtest {
    auth_request off;
    limit_except POST { deny all; }
    client_max_body_size 128k;
    proxy_read_timeout 90s;
    proxy_pass http://127.0.0.1:19313/api/backtest;
}

location ^~ /YunAlpha/workspaces/pring/ {
    auth_request off;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:19316/;
}

location = /YunAlpha/workspaces/pring/api/backtest {
    auth_request off;
    limit_except POST { deny all; }
    client_max_body_size 128k;
    proxy_read_timeout 90s;
    proxy_pass http://127.0.0.1:19316/api/backtest;
}

location ^~ /YunAlpha/ {
    auth_request off;
    alias /data/www/YunAlpha/current/site/;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff;
    limit_except GET { deny all; }
}
