[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-research-agent"
version = "0.1.0"
description = "Local, read-only fund research agent runtime and durable report workflow"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "akshare>=1.17,<2",
  "aiosqlite>=0.20,<1",
  "beautifulsoup4>=4.12,<5",
  "croniter>=6,<7",
  "duckdb>=1.0,<2",
  "deepagents==0.7.11",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain-openai==1.6.0",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite==3.1.1",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2,<3",
  "playwright>=1.60,<2",
  "pymupdf>=1.24,<2",
  "pyarrow>=15,<30",
  "pydantic>=2.10,<3",
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
  "tavily-python>=0.5,<1",
  "uvicorn>=0.30,<1",
  # Dependencies declared by the baseline MAL wheel, which is frozen locally
  # and installed with --no-deps after syncing this lock.
  "baostock==0.9.3",
  "polars==1.42.1",
  "pypdf==6.12.2",
  "snownlp==0.12.3",
  "tushare==1.4.29",
  "xlrd==2.0.2",
  "markdown-it-py>=3,<5",
]

[project.scripts]
fund-agent-api = "fund_research_agent.api.app:main"
fund-agent-worker = "fund_research_agent.workflows.report.worker:main"
fund-agent-scheduler = "fund_research_agent.schedules.runner:main"
fund-agent-doctor = "fund_research_agent.cli:doctor_main"
fund-agent-migrate = "fund_research_agent.cli:migrate_main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-timeout>=2.3,<3",
  "respx>=0.22,<1",
  "ruff>=0.15,<0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fund_research_agent.legacy_port.renderers" = ["assets/*"]
"fund_research_agent" = ["deep_skills/*/SKILL.md", "deep_skills/*/references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 120
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = [
  "src/fund_research_agent/legacy_port/snapshot",
  "src/fund_research_agent/legacy_port/renderers/build_html.py",
  "src/fund_research_agent/legacy_port/renderers/export_word.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]
